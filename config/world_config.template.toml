# AI Life Simulator 世界预设配置模板
# 启动时会自动基于此模板创建/同步 config/world_config.toml（若缺失或字段名变化）

# ==========================================
# 预设 1：普通家庭开局
# ==========================================
[[startup_presets]]
id = 1
title = "普通家庭开局"
description = "你出生在一个普通家庭，资源有限但关系温暖。"
worldview = "近未来都市世界。社会资源分层明显，但教育与互联网机会仍然存在。你的选择将影响职业、关系与命运转折。"
character_options = ["务实内向", "外向冒险", "理性规划"]
max_attribute_points = 15
start_age = 0
age_step = 1

[[startup_presets.attributes]]
key = "looks"
label = "颜值"
purpose = "影响他人的第一印象、社交机会与部分特定事件倾向。"
min_value = 0
max_value = 10
default_value = 0

[[startup_presets.attributes]]
key = "physique"
label = "体质"
purpose = "决定基础健康、抗压能力与生存下限。"
min_value = 0
max_value = 10
default_value = 0

[[startup_presets.attributes]]
key = "intelligence"
label = "智力"
purpose = "影响学习效率、信息处理与策略判断。"
min_value = 0
max_value = 10
default_value = 0

[[startup_presets.attributes]]
key = "wealth"
label = "家境"
purpose = "影响开局资源、人脉与容错空间。"
min_value = 0
max_value = 10
default_value = 0


